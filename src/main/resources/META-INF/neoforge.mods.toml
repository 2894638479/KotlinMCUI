issueTrackerURL = "${mod_issues}"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''
iconFile = "${icon}"


# Same as the Forge file: the backend brings the Kotlin runtime. NeoForge replaced `mandatory`
# with `type` in 1.20.5.
[[dependencies.${mod_id}]]
modId = "kotlinmcuibackend"
type = "required"
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

# Kept as a convenience, not as a requirement: the suite is green with this setting
# removed as well, because no test needs another class to run first. DslRuntimeTest puts
# DslRuntime back into its pre-install state per case, the entry counters are compared as
# deltas, and the integration classes save and restore the backend provider. OrderAnnotation
# stays configured so a class that genuinely needs a fixed position can still ask for one
# with a class-level @Order.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation
